[project]
name = "orbit-wars-rl"
version = "0.1.0"
description = "RL environment + training stack for the Kaggle Orbit Wars competition"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kaggle-environments>=1.21",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "truststore>=0.10",
    # torch is installed separately from the CUDA index, see README:
    #   uv pip install torch --index-url https://download.pytorch.org/whl/cu128
    "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
# torch comes from the PyTorch CUDA index, not PyPI.
override-dependencies = []

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbit_wars_rl"]
